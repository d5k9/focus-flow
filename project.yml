name: FocusFlow
options:
  bundleIdPrefix: id.dimak
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

packages:
  FocusFlowKit:
    path: .

targets:
  FocusFlow:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - App
      - Features
      - Services
      - DesignSystem
      - path: Resources/Assets.xcassets
      - path: Resources/Sounds
    dependencies:
      - package: FocusFlowKit
        product: FocusFlowKit
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: FocusFlow
        CFBundleName: FocusFlow
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026"
    entitlements:
      path: Resources/FocusFlow.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.dimak.focusflow
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # set before archiving/notarization
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
